[workspace]
resolver = "2"
members = [
    "crates/neo-core",
    "crates/neo-cli",
    "crates/neo-jni",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["neo-rust contributors"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
# 订阅抓取：只带 native-tls（Windows 走 schannel，不编译 OpenSSL/ring），
# 体积与构建风险都远小于 reqwest/ureq+rustls。
minreq = { version = "2.14", default-features = false, features = ["https-native", "proxy"] }
